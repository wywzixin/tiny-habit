<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Habits - Achievement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --color-primary: #10B981; --color-accent: #F9A825; }
        body { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease, color 0.3s ease; }

        /* Dark Mode Styles */
        body.dark-mode { background-color: #1a1a1a; color: #e7e5e4; }
        body.dark-mode .bg-stone-50 { background-color: #1a1a1a !important; }
        body.dark-mode .bg-white { background-color: #2a2a2a !important; }
        body.dark-mode .text-stone-700 { color: #e7e5e4 !important; }
        body.dark-mode .text-stone-600 { color: #a8a29e !important; }
        body.dark-mode .text-stone-400 { color: #78716c !important; }
        body.dark-mode .text-stone-500 { color: #a8a29e !important; }
        body.dark-mode .border-stone-200 { border-color: #3a3a3a !important; }
        body.dark-mode .glass { background: rgba(42,42,42,0.95) !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,0.04); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#10B981', light: '#D1FAE5' },
                        accent: '#F9A825',
                        stone: { 50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 400: '#a8a29e', 600: '#57534e', 700: '#44403C', 800: '#292524' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-700 h-screen w-full overflow-hidden flex flex-col">
    <header class="px-5 pt-12 pb-3 bg-stone-50 z-20 sticky top-0">
        <h1 class="text-xl font-bold text-stone-700">统计</h1>
    </header>
    <main class="flex-1 overflow-y-auto hide-scrollbar relative px-5 pb-28 space-y-5 pt-2">
        <!-- Points Card -->
        <div class="bg-gradient-to-br from-primary to-emerald-600 p-5 rounded-[20px] border border-primary/20 shadow-lg">
            <div class="flex items-center justify-between mb-1">
                <span class="text-sm text-white/90">累计行动值</span>
                <i data-lucide="zap" class="w-5 h-5 text-amber-300 fill-amber-300"></i>
            </div>
            <div class="text-3xl font-bold text-white">420</div>
            <div class="text-xs text-white/80 mt-1">本周 +32</div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-5 rounded-[20px] border border-stone-200">
                <div class="text-xs text-stone-400 mb-1">习惯数量</div>
                <div class="text-2xl font-bold text-stone-700">4 <span class="text-sm font-normal text-stone-400">个</span></div>
            </div>
            <div class="bg-white p-5 rounded-[20px] border border-stone-200">
                <div class="text-xs text-stone-400 mb-1">总打卡</div>
                <div class="text-2xl font-bold text-stone-700">42 <span class="text-sm font-normal text-stone-400">次</span></div>
            </div>
        </div>

        <!-- Today's Shining Moments -->
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="star" class="w-4 h-4 text-stone-700"></i>
                <h3 class="text-sm font-semibold text-stone-700">今日发光时刻</h3>
            </div>
            <div class="space-y-4 relative">
                <!-- Timeline line -->
                <div class="absolute left-[7px] top-2 bottom-2 w-0.5 bg-stone-200"></div>

                <!-- Moment 1 -->
                <div class="flex gap-3 relative">
                    <div class="w-4 h-4 rounded-full bg-primary flex-shrink-0 mt-1 z-10"></div>
                    <div class="flex-1 bg-white p-4 rounded-[16px] border border-stone-200">
                        <div class="flex items-start gap-3">
                            <div class="w-12 h-12 rounded-[12px] bg-blue-50 flex items-center justify-center text-2xl flex-shrink-0">💧</div>
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-sm font-bold text-stone-700">喝一杯温水</span>
                                    <span class="text-xs text-stone-400 flex items-center gap-1">
                                        <i data-lucide="clock" class="w-3 h-3"></i>
                                        07:15
                                    </span>
                                </div>
                                <div class="text-xs text-stone-500">庆祝方式：<span class="text-primary font-semibold">对自己微笑</span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Moment 2 -->
                <div class="flex gap-3 relative">
                    <div class="w-4 h-4 rounded-full bg-primary flex-shrink-0 mt-1 z-10"></div>
                    <div class="flex-1 bg-white p-4 rounded-[16px] border border-stone-200">
                        <div class="flex items-start gap-3">
                            <div class="w-12 h-12 rounded-[12px] bg-orange-50 flex items-center justify-center text-2xl flex-shrink-0">💪</div>
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-sm font-bold text-stone-700">只做2个深蹲</span>
                                    <span class="text-xs text-stone-400 flex items-center gap-1">
                                        <i data-lucide="clock" class="w-3 h-3"></i>
                                        08:30
                                    </span>
                                </div>
                                <div class="text-xs text-stone-500">庆祝方式：<span class="text-primary font-semibold">做一个胜利手势</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Badges -->
        <div>
            <h3 class="text-sm font-semibold text-stone-700 mb-3">勋章</h3>
            <div class="grid grid-cols-3 gap-3">
                <div class="flex flex-col items-center p-4 bg-white rounded-[16px] border border-stone-200">
                    <div class="text-2xl mb-1">🌱</div>
                    <div class="text-[11px] font-medium text-stone-600">萌芽期</div>
                </div>
                <div class="flex flex-col items-center p-4 bg-white rounded-[16px] border border-stone-200 opacity-40">
                    <div class="text-2xl mb-1 grayscale">🌳</div>
                    <div class="text-[11px] font-medium text-stone-400">成长期</div>
                </div>
                <div class="flex flex-col items-center p-4 bg-white rounded-[16px] border border-stone-200 opacity-40">
                    <div class="text-2xl mb-1 grayscale">💎</div>
                    <div class="text-[11px] font-medium text-stone-400">大师</div>
                </div>
            </div>
        </div>
    </main>
    <!-- Bottom Navigation -->
    <nav class="glass fixed bottom-0 left-0 right-0 px-6 pt-2 pb-8 z-40">
        <div class="flex justify-around items-center relative">
            <a href="home.html" class="flex flex-col items-center gap-1 py-2 opacity-50 flex-1">
                <i data-lucide="home" class="w-6 h-6 text-stone-600 stroke-[2px]"></i>
                <span class="text-[10px] font-medium text-stone-500">首页</span>
            </a>
            <a href="recipes.html" class="flex flex-col items-center gap-1 py-2 opacity-50 flex-1">
                <i data-lucide="compass" class="w-6 h-6 text-stone-600 stroke-[2px]"></i>
                <span class="text-[10px] font-medium text-stone-500">发现</span>
            </a>

            <!-- Center Floating Button -->
            <div class="flex-1 flex justify-center">
                <a href="create.html" class="absolute -top-8 w-14 h-14 bg-primary rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                    <i data-lucide="plus" class="w-7 h-7 text-white stroke-[2.5px]"></i>
                </a>
            </div>

            <a href="achievement.html" class="flex flex-col items-center gap-1 py-2 flex-1">
                <i data-lucide="bar-chart-2" class="w-6 h-6 text-primary stroke-[2px]"></i>
                <span class="text-[10px] font-semibold text-primary">统计</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-1 py-2 opacity-50 flex-1">
                <i data-lucide="user" class="w-6 h-6 text-stone-600 stroke-[2px]"></i>
                <span class="text-[10px] font-medium text-stone-500">我的</span>
            </a>
        </div>
    </nav>
    <script>
        lucide.createIcons();

        // Check for saved dark mode preference
        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
