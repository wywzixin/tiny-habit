<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Habits - 奖励中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #10B981;
            --color-accent: #F9A825;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Dark Mode Styles */
        body.dark-mode { background-color: #1a1a1a; color: #e7e5e4; }
        body.dark-mode .bg-stone-50 { background-color: #1a1a1a !important; }
        body.dark-mode .bg-white { background-color: #2a2a2a !important; }
        body.dark-mode .text-stone-700 { color: #e7e5e4 !important; }
        body.dark-mode .text-stone-600 { color: #a8a29e !important; }
        body.dark-mode .text-stone-400 { color: #78716c !important; }
        body.dark-mode .text-stone-500 { color: #a8a29e !important; }
        body.dark-mode .border-stone-200 { border-color: #3a3a3a !important; }
        body.dark-mode .border-stone-100 { border-color: #3a3a3a !important; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 99;
            pointer-events: none;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 100;
            max-height: 80vh;
        }
        body.dark-mode .modal {
            background: #2a2a2a;
        }
        .modal.show {
            transform: translateY(0);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#10B981', light: '#D1FAE5' },
                        accent: '#F9A825',
                        stone: { 50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 400: '#a8a29e', 600: '#57534e', 700: '#44403C', 800: '#292524' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-700 h-screen w-full overflow-hidden flex flex-col">
    <!-- Header -->
    <header class="px-5 pt-12 pb-3 bg-stone-50 z-20 flex justify-between items-center">
        <a href="profile.html" class="p-1 -ml-1">
            <i data-lucide="arrow-left" class="w-6 h-6 text-stone-600 stroke-[2px]"></i>
        </a>
        <h1 class="text-base font-bold text-stone-700">奖励中心</h1>
        <div class="w-8"></div>
    </header>

    <main class="flex-1 overflow-y-auto hide-scrollbar px-5 py-4 pb-10 space-y-5">
        <!-- Points Stats -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-4 rounded-[16px] border border-stone-200 text-center">
                <div class="text-[10px] text-stone-400 font-medium mb-1">可用</div>
                <div class="text-2xl font-bold text-primary" id="availablePoints">420</div>
            </div>
            <div class="bg-white p-4 rounded-[16px] border border-stone-200 text-center">
                <div class="text-[10px] text-stone-400 font-medium mb-1">累计</div>
                <div class="text-2xl font-bold text-stone-700" id="totalPoints">420</div>
            </div>
            <div class="bg-white p-4 rounded-[16px] border border-stone-200 text-center">
                <div class="text-[10px] text-stone-400 font-medium mb-1">已兑换</div>
                <div class="text-2xl font-bold text-stone-400" id="redeemedPoints">0</div>
            </div>
        </div>

        <!-- Rewards List -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-semibold text-stone-700">我的奖励</h3>
                <button onclick="showAddRewardModal()" class="flex items-center gap-1 px-3 py-1.5 bg-primary text-white text-xs font-medium rounded-[8px] active:scale-95 transition-transform">
                    <i data-lucide="plus" class="w-3 h-3 stroke-[2.5px]"></i>
                    添加奖励
                </button>
            </div>

            <!-- Rewards Container -->
            <div id="rewardsList" class="space-y-3">
                <!-- Empty State -->
                <div id="emptyState" class="bg-white p-8 rounded-[20px] border border-stone-200 text-center">
                    <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-stone-100 flex items-center justify-center">
                        <i data-lucide="gift" class="w-8 h-8 text-stone-300"></i>
                    </div>
                    <p class="text-sm text-stone-400 mb-1">还没有奖励</p>
                    <p class="text-xs text-stone-300">为自己设定一个奖励目标吧</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Reward Modal -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeAddRewardModal()"></div>
    <div id="addRewardModal" class="modal">
        <div class="p-5 pb-8">
            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-stone-700">添加奖励</h2>
                <button onclick="closeAddRewardModal()" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-400">
                    <i data-lucide="x" class="w-4 h-4 stroke-[2.5px]"></i>
                </button>
            </div>

            <!-- Form -->
            <div class="space-y-4">
                <!-- Reward Name -->
                <div>
                    <label class="text-xs font-medium text-stone-600 mb-2 block">奖励名称</label>
                    <input type="text" id="rewardName" placeholder="例如：买一本书" class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-[12px] text-sm text-stone-700 placeholder-stone-300 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                </div>

                <!-- Reward Cost -->
                <div>
                    <label class="text-xs font-medium text-stone-600 mb-2 block">所需行动值</label>
                    <input type="number" id="rewardCost" placeholder="例如：50" class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-[12px] text-sm text-stone-700 placeholder-stone-300 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                </div>

                <!-- Icon Selection -->
                <div>
                    <label class="text-xs font-medium text-stone-600 mb-2 block">选择图标</label>
                    <div class="grid grid-cols-6 gap-2">
                        <button onclick="selectIcon(this, '📚')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">📚</button>
                        <button onclick="selectIcon(this, '🎬')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🎬</button>
                        <button onclick="selectIcon(this, '🎮')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🎮</button>
                        <button onclick="selectIcon(this, '☕')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">☕</button>
                        <button onclick="selectIcon(this, '🍰')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🍰</button>
                        <button onclick="selectIcon(this, '🎁')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🎁</button>
                        <button onclick="selectIcon(this, '✈️')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">✈️</button>
                        <button onclick="selectIcon(this, '🎸')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🎸</button>
                        <button onclick="selectIcon(this, '👕')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">👕</button>
                        <button onclick="selectIcon(this, '💄')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">💄</button>
                        <button onclick="selectIcon(this, '🎨')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🎨</button>
                        <button onclick="selectIcon(this, '🏃')" class="icon-btn w-12 h-12 rounded-[10px] bg-stone-50 border border-stone-200 flex items-center justify-center text-2xl hover:border-primary transition-colors">🏃</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button onclick="addReward()" class="w-full py-4 bg-primary text-white font-semibold rounded-[12px] active:scale-98 transition-transform">
                    确认添加
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Check for saved dark mode preference
        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
        }

        // Initialize data from localStorage
        let rewardsData = {
            available: 420,
            total: 420,
            redeemed: 0,
            rewards: []
        };

        // Load saved data
        const savedData = localStorage.getItem('rewardsData');
        if (savedData) {
            rewardsData = JSON.parse(savedData);
        }

        let selectedIcon = '📚';

        // Initialize UI
        updatePointsDisplay();
        renderRewards();

        function updatePointsDisplay() {
            document.getElementById('availablePoints').textContent = rewardsData.available;
            document.getElementById('totalPoints').textContent = rewardsData.total;
            document.getElementById('redeemedPoints').textContent = rewardsData.redeemed;
        }

        function renderRewards() {
            const container = document.getElementById('rewardsList');
            const emptyState = document.getElementById('emptyState');

            if (rewardsData.rewards.length === 0) {
                emptyState.style.display = 'block';
                lucide.createIcons();
                return;
            }

            emptyState.style.display = 'none';

            container.innerHTML = rewardsData.rewards.map((reward, index) => {
                const canRedeem = rewardsData.available >= reward.cost;
                const isRedeemed = reward.status === 'redeemed';

                return `
                    <div class="bg-white p-4 rounded-[16px] border border-stone-200 ${isRedeemed ? 'opacity-60' : ''}">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-[12px] bg-stone-100 flex items-center justify-center text-2xl flex-shrink-0">${reward.icon}</div>
                            <div class="flex-1">
                                <div class="text-sm font-bold text-stone-700 ${isRedeemed ? 'line-through' : ''}">${reward.name}</div>
                                <div class="text-xs text-stone-400 mt-0.5">需要 ${reward.cost} 行动值</div>
                            </div>
                            ${isRedeemed ?
                                `<div class="px-3 py-1.5 bg-stone-100 text-stone-400 text-xs font-medium rounded-[8px]">已兑换</div>` :
                                `<button onclick="redeemReward(${index})" class="px-3 py-1.5 ${canRedeem ? 'bg-primary text-white' : 'bg-stone-100 text-stone-400 cursor-not-allowed'} text-xs font-medium rounded-[8px] active:scale-95 transition-transform" ${!canRedeem ? 'disabled' : ''}>
                                    兑换
                                </button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function showAddRewardModal() {
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('addRewardModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeAddRewardModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('addRewardModal').classList.remove('show');
            document.body.style.overflow = '';

            // Reset form
            document.getElementById('rewardName').value = '';
            document.getElementById('rewardCost').value = '';
            selectedIcon = '📚';
            document.querySelectorAll('.icon-btn').forEach(btn => {
                btn.classList.remove('border-primary', 'bg-primary-light');
            });
        }

        function selectIcon(btn, icon) {
            selectedIcon = icon;
            document.querySelectorAll('.icon-btn').forEach(b => {
                b.classList.remove('border-primary', 'bg-primary-light');
            });
            btn.classList.add('border-primary', 'bg-primary-light');
        }

        function addReward() {
            const name = document.getElementById('rewardName').value.trim();
            const cost = parseInt(document.getElementById('rewardCost').value);

            if (!name || !cost || cost <= 0) {
                alert('请填写完整的奖励信息');
                return;
            }

            const newReward = {
                id: Date.now(),
                name: name,
                cost: cost,
                icon: selectedIcon,
                status: 'pending',
                createdAt: new Date().toISOString()
            };

            rewardsData.rewards.push(newReward);
            saveData();
            renderRewards();
            closeAddRewardModal();

            if (navigator.vibrate) navigator.vibrate(10);
        }

        function redeemReward(index) {
            const reward = rewardsData.rewards[index];

            if (rewardsData.available < reward.cost) {
                alert('行动值不足，继续加油吧！');
                return;
            }

            if (confirm(`确认兑换「${reward.name}」吗？\n将消耗 ${reward.cost} 行动值`)) {
                rewardsData.available -= reward.cost;
                rewardsData.redeemed += reward.cost;
                reward.status = 'redeemed';
                reward.redeemedAt = new Date().toISOString();

                saveData();
                updatePointsDisplay();
                renderRewards();

                if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
            }
        }

        function saveData() {
            localStorage.setItem('rewardsData', JSON.stringify(rewardsData));
        }
    </script>
</body>
</html>
